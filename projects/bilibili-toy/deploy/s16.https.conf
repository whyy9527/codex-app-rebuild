server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s16.xinxiayiyan.com;
    include /etc/nginx/conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/bilibili-toy-s16/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilibili-toy-s16/privkey.pem;
    access_log /data/logs/bilibili-toy-s16_access.log proxy;
    error_log /data/logs/bilibili-toy-s16_error.log warn;
    location / {
        proxy_pass http://__GATEWAY__:18086;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
