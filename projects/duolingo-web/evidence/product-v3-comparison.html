<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原版与 Swift 实际截图对照</title><style>body{margin:24px;background:#f7f7f7;color:#333;font:16px system-ui}nav{display:flex;gap:12px;margin:20px 0}button{padding:12px 24px;border:2px solid #ddd;border-radius:12px;background:white;cursor:pointer}button[aria-pressed=true]{border-color:#58cc00;background:#e8f8dd}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:white;padding:12px;border-radius:14px}img{width:100%;height:auto}figcaption{font-weight:700;margin-bottom:12px}p{max-width:1000px;line-height:1.6}a{color:#008bad}</style><h1>实际截图对照</h1><p>左：Duolingo 匿名网页版；右：LingoSeed 原生 Swift。原版约1200×732内容区（拼句1192×658），Swift为1200×760窗口含标题栏和系统阴影，Retina截图分辨率不同。保留整张截图，未用裁切掩盖差异。对照结构、颜色、留白、层次与控件，不宣称像素相同。题库、角色和声音为原创替代。</p><nav aria-label="选择页面"></nav><div class="pair"><figure><figcaption>原版网页参考</figcaption><a id="leftLink"><img id="left" alt="原版实际截图"></a></figure><figure><figcaption>Swift 实际客户端</figcaption><a id="rightLink"><img id="right" alt="Swift实际截图"></a></figure></div><p id="note"></p><script>const states=[['home-wide','home','主页','白底三栏、侧导航、绿色单元横幅、弯曲节点、右侧信息卡对应。Swift为两课与真实重练，右栏为本地数据；未模拟在线宝石经济。'],['choice','choice','选择题','同类顶部关闭/进度/生命，三张带厚度的图卡，底部固定检查。图片、题面不同。'],['matching','matching','配对','两列可选择词块和边框厚度对应。原版5对，本地原创3对；配对自动完成有反馈与声音。'],['word-tiles','word-tiles','拼句','角色与发音提示、答案横线、词块、底部检查对应。原版西语翻译，本地按英语提示组句。']];function show(s){left.src='product-v3-reference/'+s[1]+'.png';right.src='product-v3-final/'+s[0]+'.png';leftLink.href=left.src;rightLink.href=right.src;note.textContent=s[3];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===s[2]))}states.forEach(s=>{const b=document.createElement('button');b.textContent=s[2];b.onclick=()=>show(s);document.querySelector('nav').append(b)});show(states[0]);</script></html>
