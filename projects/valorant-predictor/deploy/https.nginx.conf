# Owned exclusively by projects/valorant-predictor; separate from company site.
server {
    listen 80;
    listen [::]:80;
    server_name valorant.xinxiayiyan.com;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name valorant.xinxiayiyan.com;
    include /etc/nginx/conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/valorant-predictor/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valorant-predictor/privkey.pem;
    access_log /data/logs/valorant-predictor_access.log proxy;
    error_log /data/logs/valorant-predictor_error.log warn;
    location / {
        proxy_pass http://valorant-predictor:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
