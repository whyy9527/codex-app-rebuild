# Owned exclusively by projects/valorant-predictor. Initial ACME entry point.
server {
    listen 80;
    listen [::]:80;
    server_name valorant.xinxiayiyan.com;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / {
        proxy_pass http://valorant-predictor:8080;
        proxy_set_header Host $host;
    }
}
